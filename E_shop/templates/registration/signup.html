{% extends 'master.html'%}

{% load static %}

{% block title %}Sign Up{% endblock %}


{% block content %}

<section id="form"><!--form-->
    <div class="container">
        <div class="col-sm-4 col-sm-offset-1">
            <div class="login-form"><!--login form-->
                    <h2>Sign Up for your account</h2>
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                        {{ field.errors }}
                        <p>{{ field }}</p>
                        {% endfor %}

                        <button class="btn btn-default" type="submit">Sign Up</button>
                        <a href="{% url 'login' %}"><span style="color: black; margin-left: 70px">
                            Already have an account! &nbsp; &rarr;</span>
                            Login
                        </a>
                    </form>
            </div>

        </div>

    </div>
</section>

{% endblock %}
